<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SICAPDA by FLUXE</title>
  <desc id="desc">Featured project: SICAPDA, a smart access control and meal demand forecasting platform built by FLUXE.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC400" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#FFC400" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="0.5" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FFF1BF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="840 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FFC400" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="378" rx="22"/></clipPath>
    <clipPath id="plot"><rect x="742" y="96" width="0" height="160"><animate attributeName="width" values="0;380;380;0" keyTimes="0;0.25;0.92;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .glow { animation: glow 10s ease-in-out infinite alternate; }
    .b { transform-box: fill-box; transform-origin: bottom; animation: grow 8s cubic-bezier(.2,.8,.2,1) infinite; }
    .b2 { animation-delay: .12s; } .b3 { animation-delay: .24s; } .b4 { animation-delay: .36s; } .b5 { animation-delay: .48s; } .b6 { animation-delay: .6s; } .b7 { animation-delay: .72s; }
    .live { animation: blink 1.6s ease-in-out infinite; }
    .wave { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .w2 { animation-delay: .8s; } .w3 { animation-delay: 1.6s; }
    .granted { animation: granted 4.8s ease-in-out infinite; }
    .chip { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .c1 { animation-delay: .2s; } .c2 { animation-delay: .35s; } .c3 { animation-delay: .5s; } .c4 { animation-delay: .65s; }
    @keyframes glow { from { transform: translate(0,0); } to { transform: translate(-120px,30px); } }
    @keyframes grow { 0% { transform: scaleY(0); } 18%, 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes granted { 0%, 20% { opacity: 0; } 30%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .chip, .granted { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#141414"/>
    <g filter="url(#blur)" opacity="0.35">
      <circle class="glow" cx="1080" cy="60" r="160" fill="#FFC400"/>
      <circle cx="120" cy="380" r="140" fill="#B38600"/>
    </g>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect x="0" y="0" width="6" height="380" fill="#FFC400"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="22" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Left: copy -->
  <g class="sans">
    <rect x="60" y="48" width="168" height="28" rx="14" fill="#FFC400" fill-opacity="0.12" stroke="#FFC400" stroke-opacity="0.45"/>
    <text x="144" y="67" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.6" fill="#FFC400">FEATURED PROJECT</text>

    <text x="58" y="138" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#brand)">SICAPDA</text>
    <text x="354" y="138" font-size="18" font-weight="600" fill="#A1A1A1">by <tspan fill="#F3F3F3" letter-spacing="2">FLUXE</tspan></text>

    <text x="60" y="180" font-size="18" fill="#D4D4D4">Smart access control and meal demand forecasting</text>
    <text x="60" y="205" font-size="18" fill="#D4D4D4">for companies, schools and residential communities.</text>
  </g>

  <g class="sans" font-size="14" font-weight="600" fill="#F3F3F3">
    <g class="chip c1">
      <rect x="60" y="232" width="232" height="38" rx="10" fill="#1E1E1E" stroke="#333"/>
      <circle cx="80" cy="251" r="4" fill="#FFC400"/>
      <text x="94" y="256">RFID &amp; biometric access</text>
    </g>
    <g class="chip c2">
      <rect x="304" y="232" width="232" height="38" rx="10" fill="#1E1E1E" stroke="#333"/>
      <circle cx="324" cy="251" r="4" fill="#58A6FF"/>
      <text x="338" y="256">Meal demand forecasting</text>
    </g>
    <g class="chip c3">
      <rect x="60" y="280" width="232" height="38" rx="10" fill="#1E1E1E" stroke="#333"/>
      <circle cx="80" cy="299" r="4" fill="#3FB950"/>
      <text x="94" y="304">IoT turnstile · ESP32</text>
    </g>
    <g class="chip c4">
      <rect x="304" y="280" width="232" height="38" rx="10" fill="#1E1E1E" stroke="#333"/>
      <circle cx="324" cy="299" r="4" fill="#D2A8FF"/>
      <text x="338" y="304">AI assistant &amp; reports</text>
    </g>
  </g>

  <text x="60" y="350" class="mono" font-size="13" fill="#7A7A7A">PHP · MySQL · JavaScript · Flutter · Python · ESP32</text>

  <!-- Right: dashboard -->
  <g>
    <rect x="716" y="48" width="430" height="284" rx="16" fill="#1A1A1A" stroke="#2E2E2E"/>
    <text x="740" y="80" class="sans" font-size="14" font-weight="700" fill="#F3F3F3">Demand forecast</text>
    <circle class="live" cx="1076" cy="75" r="4" fill="#3FB950"/>
    <text x="1088" y="80" class="sans" font-size="12" font-weight="600" fill="#8B949E">Live</text>

    <g stroke="#2A2A2A">
      <path d="M742 136H1122M742 176H1122M742 216H1122"/>
      <path d="M742 256H1122" stroke="#3A3A3A"/>
    </g>

    <g fill="url(#bar)">
      <rect class="b"    x="756"  y="176" width="34" height="80" rx="5"/>
      <rect class="b b2" x="808"  y="150" width="34" height="106" rx="5"/>
      <rect class="b b3" x="860"  y="166" width="34" height="90" rx="5"/>
      <rect class="b b4" x="912"  y="128" width="34" height="128" rx="5"/>
      <rect class="b b5" x="964"  y="142" width="34" height="114" rx="5"/>
      <rect class="b b6" x="1016" y="196" width="34" height="60" rx="5"/>
      <rect class="b b7" x="1068" y="208" width="34" height="48" rx="5"/>
    </g>

    <g clip-path="url(#plot)">
      <path d="M773 168 L825 142 L877 160 L929 118 L981 136 L1033 190 L1085 200 L1085 256 L773 256 Z" fill="url(#area)"/>
      <path d="M773 168 L825 142 L877 160 L929 118 L981 136 L1033 190 L1085 200" stroke="#58A6FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#141414" stroke="#58A6FF" stroke-width="2">
        <circle cx="773" cy="168" r="4"/><circle cx="825" cy="142" r="4"/><circle cx="877" cy="160" r="4"/>
        <circle cx="929" cy="118" r="4"/><circle cx="981" cy="136" r="4"/><circle cx="1033" cy="190" r="4"/><circle cx="1085" cy="200" r="4"/>
      </g>
    </g>

    <g class="mono" font-size="11" fill="#6E6E6E" text-anchor="middle">
      <text x="773" y="274">MON</text><text x="825" y="274">TUE</text><text x="877" y="274">WED</text><text x="929" y="274">THU</text>
      <text x="981" y="274">FRI</text><text x="1033" y="274">SAT</text><text x="1085" y="274">SUN</text>
    </g>

    <g class="sans" font-size="12" font-weight="600">
      <rect x="742" y="294" width="10" height="10" rx="2" fill="#FFC400"/>
      <text x="758" y="303" fill="#A1A1A1">Actual</text>
      <rect x="814" y="297" width="14" height="3" rx="1.5" fill="#58A6FF"/>
      <text x="834" y="303" fill="#A1A1A1">Forecast</text>
    </g>

    <!-- RFID access pill -->
    <g>
      <circle class="wave"    cx="958" cy="299" r="10" stroke="#FFC400" stroke-width="1.5"/>
      <circle class="wave w2" cx="958" cy="299" r="10" stroke="#FFC400" stroke-width="1.5"/>
      <rect x="950" y="293" width="16" height="12" rx="2.5" fill="#FFC400"/>
      <rect x="953" y="296" width="5" height="4" rx="1" fill="#141414"/>
      <g class="granted">
        <rect x="980" y="287" width="142" height="24" rx="12" fill="#3FB950" fill-opacity="0.14" stroke="#3FB950" stroke-opacity="0.5"/>
        <text x="1051" y="303" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#56D364">✓ Access granted</text>
      </g>
    </g>
  </g>
</svg>
