<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rian Rafael</title>
  <desc id="desc">Animated header: Rian Rafael, full-stack developer and software development student at SENAI.</desc>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#39D0D8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#30363D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8B949E" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="22"/></clipPath>
    <clipPath id="l1"><rect x="790" y="0" height="320" width="0"><animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.02;0.12;0.9;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="790" y="0" height="320" width="0"><animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.12;0.24;0.9;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="790" y="0" height="320" width="0"><animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.24;0.38;0.9;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="790" y="0" height="320" width="0"><animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.38;0.5;0.9;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l5"><rect x="790" y="0" height="320" width="0"><animate attributeName="width" values="0;0;340;340;0" keyTimes="0;0.5;0.56;0.9;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .orb-a { animation: drift-a 14s ease-in-out infinite alternate; }
    .orb-b { animation: drift-b 17s ease-in-out infinite alternate; }
    .orb-c { animation: drift-c 12s ease-in-out infinite alternate; }
    .rise  { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .75s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .spin { transform-origin: 950px 160px; animation: spin 40s linear infinite; }
    .spin-rev { transform-origin: 950px 160px; animation: spin 60s linear infinite reverse; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes drift-a { from { transform: translate(0,0); } to { transform: translate(140px,40px); } }
    @keyframes drift-b { from { transform: translate(0,0); } to { transform: translate(-160px,-30px); } }
    @keyframes drift-c { from { transform: translate(0,0); } to { transform: translate(60px,-50px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="orb-a" cx="180" cy="60" r="150" fill="#1F6FEB"/>
      <circle class="orb-b" cx="1050" cy="270" r="170" fill="#8957E5"/>
      <circle class="orb-c" cx="640" cy="330" r="120" fill="#1B7C83"/>
    </g>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="22" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Left: intro -->
  <g class="mono rise d1" font-size="16" fill="#8B949E">
    <text x="72" y="92"><tspan fill="#3FB950">~/rianzitos</tspan> <tspan fill="#58A6FF">$</tspan> whoami<tspan class="cursor" fill="#C9D1D9"> ▍</tspan></text>
  </g>
  <g class="rise d2">
    <text x="68" y="170" class="sans" font-size="74" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Rian Rafael</text>
  </g>
  <g class="rise d3">
    <text x="72" y="214" class="sans" font-size="22" font-weight="500" fill="#C9D1D9">Full-Stack Developer <tspan fill="#484F58">·</tspan> Software Development Student</text>
  </g>
  <g class="rise d4 sans" font-size="14" font-weight="600">
    <rect x="72" y="240" width="118" height="30" rx="15" fill="#58A6FF" fill-opacity="0.12" stroke="#58A6FF" stroke-opacity="0.35"/>
    <text x="131" y="260" text-anchor="middle" fill="#79C0FF">Web Apps</text>
    <rect x="200" y="240" width="96" height="30" rx="15" fill="#A371F7" fill-opacity="0.12" stroke="#A371F7" stroke-opacity="0.35"/>
    <text x="248" y="260" text-anchor="middle" fill="#D2A8FF">Mobile</text>
    <rect x="306" y="240" width="96" height="30" rx="15" fill="#39D0D8" fill-opacity="0.12" stroke="#39D0D8" stroke-opacity="0.35"/>
    <text x="354" y="260" text-anchor="middle" fill="#76E3EA">UI / UX</text>
    <circle class="pulse" cx="426" cy="255" r="5" fill="#3FB950"/>
    <text x="440" y="260" fill="#8B949E" font-weight="500">Currently building SICAPDA</text>
  </g>

  <!-- Right: orbit + code window -->
  <g opacity="0.5">
    <g class="spin">
      <circle cx="950" cy="160" r="128" stroke="#58A6FF" stroke-opacity="0.25" stroke-dasharray="2 10"/>
      <circle cx="1078" cy="160" r="4" fill="#58A6FF"/>
    </g>
    <g class="spin-rev">
      <circle cx="950" cy="160" r="150" stroke="#A371F7" stroke-opacity="0.2" stroke-dasharray="1 7"/>
      <circle cx="950" cy="10" r="3.5" fill="#A371F7"/>
    </g>
  </g>

  <g class="float">
    <rect x="770" y="78" width="370" height="174" rx="14" fill="#161B22" fill-opacity="0.92" stroke="#30363D"/>
    <path d="M770 106H1140" stroke="#30363D"/>
    <circle cx="790" cy="92" r="5" fill="#FF7B72"/>
    <circle cx="808" cy="92" r="5" fill="#E3B341"/>
    <circle cx="826" cy="92" r="5" fill="#3FB950"/>
    <text x="955" y="96" text-anchor="middle" class="mono" font-size="12" fill="#6E7681">rian.ts</text>

    <g class="mono" font-size="14" fill="#C9D1D9">
      <text x="790" y="134" clip-path="url(#l1)"><tspan fill="#FF7B72">const</tspan> <tspan fill="#D2A8FF">rian</tspan> = {</text>
      <text x="808" y="158" clip-path="url(#l2)"><tspan fill="#79C0FF">role</tspan>: <tspan fill="#A5D6FF">"Full-Stack Dev"</tspan>,</text>
      <text x="808" y="182" clip-path="url(#l3)"><tspan fill="#79C0FF">stack</tspan>: [<tspan fill="#A5D6FF">"PHP"</tspan>, <tspan fill="#A5D6FF">"TS"</tspan>, <tspan fill="#A5D6FF">"Flutter"</tspan>],</text>
      <text x="808" y="206" clip-path="url(#l4)"><tspan fill="#79C0FF">building</tspan>: <tspan fill="#A5D6FF">"SICAPDA"</tspan>,</text>
      <text x="790" y="230" clip-path="url(#l5)">};</text>
    </g>
  </g>
</svg>
