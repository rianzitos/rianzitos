<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" fill="none" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#58A6FF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#A371F7" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#39D0D8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#39D0D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9E4FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <mask id="edges"><rect width="1200" height="24" fill="url(#base)"/></mask>
  </defs>
  <style>
    .beam { animation: sweep 4.5s cubic-bezier(.45,0,.25,1) infinite; }
    .node { transform-origin: 600px 12px; animation: pulse 2.25s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-240px); } to { transform: translateX(1200px); } }
    @keyframes pulse { 0%,100% { transform: rotate(45deg) scale(1); opacity: .7; } 50% { transform: rotate(45deg) scale(1.25); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .beam { animation: none; opacity: 0; } .node { animation: none; transform: rotate(45deg); } }
  </style>
  <rect x="0" y="11.5" width="1200" height="1" fill="url(#base)"/>
  <g mask="url(#edges)">
    <g class="beam">
      <rect x="0" y="10" width="240" height="4" rx="2" fill="url(#beam)" filter="url(#glow)"/>
      <rect x="0" y="11.25" width="240" height="1.5" rx="0.75" fill="url(#beam)"/>
    </g>
  </g>
  <rect class="node" x="595" y="7" width="10" height="10" rx="2" fill="#A371F7" fill-opacity="0.18" stroke="#A371F7" stroke-width="1.5"/>
  <circle cx="570" cy="12" r="1.8" fill="#58A6FF" opacity="0.8"/>
  <circle cx="630" cy="12" r="1.8" fill="#39D0D8" opacity="0.8"/>
</svg>
